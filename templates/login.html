{% extends "base.html" %}

{% block title %}Admin Login - Campus Security System{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-circle">🔒</div>
            <h1 class="auth-title">Security Admin Login</h1>
            <p class="auth-subtitle">AI-Based Campus Access Monitoring System</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Administrator Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary">Authenticate & Access Dashboard</button>
        </form>

        <div class="dev-note">
            ⚠️ <strong>Development Note:</strong> Default login credentials are <code>admin</code> / <code>admin123</code>.
        </div>
    </div>
</div>
{% endblock %}
